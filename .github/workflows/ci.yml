name: LocalGo Services CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run Maven Tests
        working-directory: backend
        run: mvn -B test

  firestore-rules-tests:
    name: Firestore Security Rules Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21 (for Firestore Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Firebase CLI & Rules Test Dependencies
        run: |
          npm install -g firebase-tools
          cd firestore-rules-tests
          npm install
      - name: Run Firestore Rules Tests under Emulator
        working-directory: firestore-rules-tests
        run: firebase emulators:exec --only firestore "npm test"

  frontend-builds:
    name: Frontend Production Builds
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [customer-app, provider-app, admin-app]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Install and Build ${{ matrix.app }}
        working-directory: ${{ matrix.app }}
        run: |
          npm install
          npm run build
