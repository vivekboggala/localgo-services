# Server
server.port=${PORT:8080}

# Firebase Configuration
app.firebase.credential-path=${FIREBASE_CREDENTIALS_PATH:${APP_FIREBASE_CREDENTIAL_PATH:}}
app.firebase.project-id=${APP_FIREBASE_PROJECT_ID:localgo-824dd}

# File Upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Mail Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# OTP Config
app.mail.from=${MAIL_FROM:}
app.mail.brevo-api-key=${BREVO_API_KEY:}
app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.webhook-url=${EMAIL_WEBHOOK_URL:}
app.dev-otp-logging=${DEV_OTP_LOGGING:false}

# Logging
logging.level.com.localgo=DEBUG
logging.level.org.springframework.security=INFO