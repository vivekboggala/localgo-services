# Server
server.port=${PORT:8080}

# Firebase Configuration
app.firebase.credential-path=${FIREBASE_CREDENTIALS_PATH:${APP_FIREBASE_CREDENTIAL_PATH:}}
app.firebase.project-id=${APP_FIREBASE_PROJECT_ID:localgo-824dd}

# File Upload
spring.servlet.multipart.max-file-size=5MB
